aid: athletic-brewing
name: Athletic Brewing
description: >-
  Athletic Brewing Company is a Milford, Connecticut brewer of craft non-alcoholic beer,
  founded in 2017 by Bill Shufelt and John Walker, selling direct-to-consumer across the
  United States alongside national retail distribution. Athletic Brewing is not a software
  company and publishes no developer program, but its Shopify-hosted storefront at
  athleticbrewing.com exposes a real, anonymous, machine-readable agent commerce surface:
  a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a live MCP
  endpoint at /api/ucp/mcp serving thirteen catalog, cart, checkout and order tools with
  full JSON Schema, an OpenID Connect discovery document for Shopify customer accounts,
  and a published /llms.txt and /agents.md that document the agent flow and its
  buyer-approval rules.
