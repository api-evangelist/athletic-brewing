apis:
- name: Athletic Brewing UCP Commerce (MCP)
  description: >-
    The Universal Commerce Protocol shopping service Athletic Brewing's Shopify storefront
    serves at https://athleticbrewing.com/api/ucp/mcp. An anonymous MCP (JSON-RPC 2.0)
    endpoint exposing thirteen tools across catalog search and lookup, product detail, cart
    lifecycle, checkout lifecycle and order retrieval. Payment completion requires a
    contemporaneous human approval step and a required meta.idempotency-key.
  humanURL: https://athleticbrewing.com/agents.md
  baseURL: https://athleticbrewing.com/api/ucp/mcp
